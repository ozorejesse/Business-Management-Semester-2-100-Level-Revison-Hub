const S=[
[5,"Military Rule & the Civil War","Covers Nigeria’s independence, the failed search for national unity, the 1966 coups, the pogrom, the 1967–70 civil war, the later coups to 1993, and the legacy of military rule.",[
["Independence and the national question",["Nigeria became independent from Britain on <b>October 1, 1960</b>.","The <b>national question</b>: What is Nigeria? Who are Nigerians? How do we build a meaningful national identity?","The <b>regional system</b> weakened national consciousness: national power came from first holding regional power, which fed the fear of domination.","Efforts at unity (a strong central state, a state-run development economy) failed because of official corruption, rigged elections, ethnic baiting, bullying and thuggery in the First Republic."]],
["Art and the national question",["Writers promoted unity: Chinua Achebe (<i>Things Fall Apart</i>, 1958), Amos Tutuola (<i>The Palm-Wine Drinkard</i>, 1952), Wole Soyinka (<i>A Dance of the Forest</i>, 1960).","Sculptors Uche Okeke, Susanne Wenger and Felix Idubor drew on pre-colonial traditions and motifs.","Plays and universities had multi-ethnic casts and populations, but the national question still went unsolved and ethnic tensions ended in civil war."]],
["Economy and development corporations (1960–66)",["The <b>First National Development Plan (1962–68)</b> focused on agriculture, industry and education.","1960–66 shifts: agriculture fell from 63.4% to 55.6% of GNP; manufacturing rose from 3.6% to 6.2%; mining from 0.9% to 4.8%; distribution from 9.1% to 14%; national income grew about 5% a year.","The 1966 coup ended development planning.","The Richards Constitution introduced <b>regionalism</b> (adopted in the First Republic). Regional development corporations (Western, Eastern and Northern Nigeria) drove growth by focusing on comparative advantage: West – cocoa and timber; East – palm oil; North – groundnut."]],
["Politics of the First Republic",["Instability came from the 1959 election, fear of dominance, the quota system and uneven project allocation.","Crises: the Western Region crisis, creation of the Mid-Western Region, the 1962–63 census crisis, the 1964 election crisis (UPGA vs NNA) and the 1965 Western Region election."]],
["First coup (January 15, 1966) and Ironsi",["Led by the “five majors”: Nzeogwu, Ifeajuna, Okafor, Anuforo and Ademoyega, who blamed tribalism and corruption.","Killed Prime Minister Balewa, the Sardauna of Sokoto, Finance Minister Okotie-Eboh, Western Premier Akintola and senior officers such as Brigadiers Maimalari and Ademulegun. Very few easterners died, so it was labelled an “Igbo coup”.","The plotters failed to seize power; acting Senate President Nwafor Orizu handed power to Maj-Gen <b>Aguiyi-Ironsi</b>, who suspended the constitution and set up an interim military government.","Ironsi aimed to restore order, end regionalism, tribalism and corruption; he appointed military governors (e.g. Ojukwu in the East). The coup was popular in the south.","<b>Ironsi’s gaffes:</b> he released the plotters, surrounded himself with Igbo advisers, promoted Igbo officers faster, and issued the Unification Decree (Decree No. 34), so northerners feared domination."]],
["Countercoup, pogrom and secession (1966–67)",["<b>July 29, 1966:</b> northern officers killed Ironsi in Ibadan. Lt-Col <b>Yakubu Gowon</b> became head of state and repealed Decree 34. Gowon and Ojukwu clashed over seniority.","<b>Pogrom:</b> about 80,000–100,000 easterners were killed in the north, prompting revenge killings in the East and a mass return of Igbos.","Ojukwu pushed for secession; talks such as the <b>Aburi Accord</b> failed, and he declared Biafra independent on <b>May 30, 1967</b>."]],
["The civil war (1967–70)",["Federal reasons to resist: belief in Nigerian unity, fear of fragmentation, and Biafra leaving with the oil-producing states.","Gowon declared a state of emergency and created <b>12 states</b>; only one of the three Eastern states was mainly Igbo. A coastal blockade and a currency change caused malnutrition, inflation and economic strangulation.","Biafra used images of starving children as evidence of genocide and won international sympathy, which prolonged the war.","<b>International stance:</b> the OAU treated it as a conflict between two nations; the US and UK stayed neutral; the USSR backed the federal government with aircraft and advisers; Tanzania, Gabon, Ivory Coast and Zambia recognised Biafra in 1968; France and Portugal supplied Biafra; Israel and China sympathised; the Catholic Church and Red Cross gave aid.","<b>End:</b> Biafra was overrun by January 1970; Ojukwu fled to Ivory Coast and Effiong surrendered to Gowon in Lagos on January 12, 1970.","<b>Legacy:</b> up to 3 million dead and 3 million displaced; Gowon declared “no winner, no vanquished”."]],
["Later coups (1975–1993)",["<b>1975:</b> Gowon promised to end military rule by October 1, 1976 but postponed it in 1974. Officers led by Col. Joseph Garba removed him in a bloodless coup; Murtala Muhammed became Head of State with Obasanjo as deputy.","<b>1976 (Dimka):</b> Lt-Col Buka Suka Dimka assassinated Murtala Muhammed, citing corruption. It failed without senior officers’ support; Obasanjo took over and handed power to Shehu Shagari’s civilian government.","<b>1983 (Buhari):</b> after Shagari’s re-election, Maj-Gen Buhari acted against an “inept and corrupt” government.","<b>1985 (Babangida):</b> he cited Buhari’s “rigid and uncompromising” rule; Buhari was detained until 1988 and Idiagbon was under house arrest for three years. Babangida promised civil rule but moved the handover date three times and ruled until 1993.","<b>1990 (Orkar):</b> a failed coup on April 20; Major Gideon Orkar seized the radio station and announced the south’s secession; crushed within 10 hours, with 42 executed in July.","<b>1993 (Abacha):</b> after the annulment of June 12, Babangida handed over to Shonekan’s interim government; Abacha overthrew it on November 17, 1993.","<b>End of military rule:</b> Abacha died in 1998; Abdulsalami Abubakar ran the shortest transition; Obasanjo, released from prison, beat Olu Falae in 1999 and became the elected president of the Fourth Republic."]],
["Pros and cons of military rule",["<b>Pros:</b> kept Nigeria as one, infrastructure development, relocation of the FCT to Abuja, creation of states, bold policies such as NYSC and ECOWAS, and Murtala Muhammed’s deliberate foreign policy.","<b>Cons:</b> responsible for the civil war, corruption and impoverishment, no checks and balances, uncoordinated policy, lack of administrative acumen, killings and human-rights violations, press suppression, economic uncertainty from coups, mismanaged oil boom, being stooges of bodies like the IMF, and disregard for the rule of law and judiciary.","<b>Verdict:</b> military intervention derailed progress and left criminality, abuse of the rule of law and underdevelopment. Awolowo said the best military government cannot be better than the worst civilian one."]]]],

[6,"Modern Economic Realities","Traces Nigeria’s economy from the agrarian independence era through the oil boom, SAP and democracy, then the causes of today’s problems and proposed solutions.",[
["Introduction",["Nigeria is Africa’s most populous and largest country: 140,431,790 people in the 2006 census and about 180 million by 2015, the sixth most populous nation after China, India, the USA, Indonesia and Brazil.","Rich in resources: crude oil, gold, tin, iron ore, niobium, lead, zinc, limestone and salt, plus arable land for palm oil, cocoa, groundnut, beans, melon, maize and rice.","Agriculture was the economic hub until oil in commercial quantity shifted Nigeria from an agriculture-dependent to a crude-oil-dependent nation."]],
["Nigeria at independence",["Agriculture was over 50% of GDP before independence and absorbed over 75% of the workforce in 1960.","Development corporations were central to the regional political structure.","GDP growth jumped from 1.89% (1960) to 4.89% (1965). Nigeria was tipped to be among the 20 largest economies by 1980, ahead of Malaysia; today the reverse is true."]],
["Post-civil war period",["The coups and civil war truncated progress; the military government destroyed the economic structure on which the regional system rested.","In the 1970s oil boom the government did not save; Nigeria abandoned agriculture for easy oil money.","When the oil market crashed, Nigeria struggled in the mid-1980s and the Buhari regime introduced austerity. The IMF pressed African countries, including Nigeria, to adopt the <b>Structural Adjustment Programme (SAP)</b>."]],
["The SAP era",["SAP further weakened the economy and the naira began a downward slide.","It destroyed the manufacturing base: imported goods flooded the market and local products could not compete on price and quality.","During another oil boom in the 1990s, Head of State Sani Abacha looted the treasury and kept the funds in foreign banks."]],
["Democracy and the economy",["After 1999, GDP growth rose from 0.58% to 6.59% (Premium Times, 2023).","Under Obasanjo, Nigeria got $20 billion in debt relief and reserves passed $64 billion.","After Yar’Adua’s death, Goodluck Jonathan spent the savings recklessly; reserves fell to $34 billion by 2015 even though oil stayed above $100 for most of his term.","US shale oil reduced demand for Nigerian crude; in 2014 the US, the largest buyer, announced reduced purchases. Analyst Olivier Jakob predicted Nigerian crude might need discounts to reach Asian markets.","With production down and India replacing the US as chief buyer, the budget has been in deficit and the country borrows to balance it; austerity measures have followed."]],
["Causes of Nigeria’s economic woes",["Over-dependence on crude oil for government revenue.","Corruption.","Banking-sector insider abuses, breaches of the corporate governance code and many non-performing loans; capital-market round-tripping that crashed share prices.","Poor economic policies.","Violence and oil-pipeline vandalism.","Weak planning and policy direction, late budget implementation and unguided utterances by officials."]],
["Solutions and conclusion",["Economic diversification and economic tutelage from a metropolitan state.","Curb corruption and cut the cost of governance.","Electricity to boost manufacturing, industrial parks and clusters, and higher local refining capacity.","Improve the political-economic structure, collect taxes effectively and invest in tourism.","<b>Conclusion:</b> problems will worsen without diversification away from crude, as renewable energy grows. Nigeria’s people are a vital resource, so government should invest more in them."]]]],

[7,"Human Rights Abuses","Defines human rights and abuses, shows where rights are protected in Nigerian law, and examines five common abuses.",[
["What human rights are",["Rights inherent to all human beings regardless of race, sex, nationality, ethnicity, language, religion or any other status.","Article 1 of the UN Declaration of Human Rights says all people are born free and equal in dignity and rights, endowed with reason and conscience, and should act in a spirit of brotherhood.","Examples: right to life and liberty, freedom from slavery and torture, freedom of opinion and expression, right to work and education, equality before the law, protection from discrimination, equal pay for equal work."]],
["Human rights in Nigeria",["Found in <b>Chapter IV (Sections 33–46)</b> of the 1999 Constitution; the African Charter on Human and Peoples’ Rights is also enforceable in Nigerian courts.","Rights include freedom of religion, freedom of speech, right to education, freedom of movement and right to life."]],
["Human rights abuses",["An abuse is anything that harms someone’s human rights, including harm to people, communities and the environment.","The 1979 Constitution introduced Fundamental Objectives and Directive Principles of State Policy and Fundamental Human Rights, but shortcomings and inhibitions remain in the 2009 Rules.","The National Human Rights Commission received <b>1,701,519</b> complaints in 2021, up from <b>1,287,280</b> in 2020."]],
["Extra-judicial killings",["Security forces, especially police and military, have been implicated in extra-judicial killings, torture and excessive force.","The <b>#EndSARS</b> protests of October 2020 brought international attention to police brutality.","Examples include killings by law-enforcement officials and non-state actors, death sentences, and deaths in custody from force or failure to protect life."]],
["Rape",["A serious abuse worldwide, including Nigeria. Government and civil organisations are working on it, but stigma, underreporting, inadequate legal frameworks, poor access to justice and limited survivor support remain.","About 367,000 women- and gender-related issues were recorded in 2021."]],
["Freedom of expression",["The government is criticised for restricting freedom of speech and the press, including online media; critics reported threats, intimidation, arrest, detention and sometimes violence.","Security services detained and harassed journalists, sometimes for reporting on corruption and security.","The National Broadcasting Commission (NBC) regulates broadcasting; the government used its oversight to clamp down on television and radio stations."]],
["Child marriage",["A discriminatory practice affecting mostly girls and prohibited under international law. A State violates international law if it fails to set and enforce a minimum marriage age (equal for boys and girls), fails to act with due diligence to prevent it, or involves public officials in it.","43% of Nigerian girls marry before 18 and 16% before 15 (Aliogo, 2023)."]],
["Domestic violence",["The <b>Violence Against Persons (Prohibition) Act (2015)</b> criminalises various forms of abuse and provides for reporting, prosecution and survivor support.","Challenges: underreporting due to stigma, weak enforcement, limited awareness and education, and too few accessible support services."]],
["Conclusion",["A nation’s attitude to human rights shows its leaders’ values; signing treaties does not validate rights.","International documents are standards; every government agency must enforce the constitutional norms, and penalties should apply regardless of socioeconomic class."]]]],

[8,"Citizenship & Civic Duties","Explains citizenship, how Nigerians acquire, renounce and lose it, and the civic duties the Constitution imposes.",[
["What citizenship is",["The state of being a citizen, plus the rights, obligations and advantages that come with it: to live, work, vote and pay taxes in a nation.","Usually granted where you are born; immigrants must apply.","It is often confused with nationality, which is wider in scope."]],
["History in Nigeria",["There were no Nigerian citizens before independence; the Constitution has provided for citizenship since then.","Key laws: the Nigeria Citizenship Act 1960, the Nigerian Citizenship Act 1961, the 1979 Constitution and the 1999 Constitution (as amended), whose <b>Chapter III</b> provides extensively for citizenship."]],
["Citizenship by birth",["A person is a Nigerian citizen by birth if both parents, either parent, or any one grandparent is Nigerian."]],
["Citizenship by registration",["Open to a non-Nigerian woman married to a Nigerian, and to every person of full age and capacity born outside Nigeria whose grandparent is a Nigerian citizen.","The applicant must prove to the President good character, a clear intention to live in Nigeria, and that they have taken the Oath of Allegiance in the <b>Seventh Schedule</b>."]],
["Citizenship by naturalisation",["The formal process of granting citizenship to a foreign national who meets the legal criteria; for Nigeria, the requirements are in <b>Section 27</b> of the 1999 Constitution.","A certificate of grant of citizenship by naturalisation is issued; it is how a foreigner who has lived long in Nigeria can become a citizen."]],
["Dual citizenship",["Allowed: a foreigner who is a citizen of another country by birth may also become Nigerian by registration or naturalisation, and a Nigerian by birth may acquire another citizenship without renouncing Nigerian citizenship."]],
["Renunciation",["A Nigerian of full age may renounce citizenship by making the prescribed declaration and take another country’s citizenship.","The President may refuse to register the declaration, especially when Nigeria is at war or when it is contrary to public policy."]],
["Loss of citizenship",["The President may deprive a person who is not a citizen by birth or registration if they are sentenced to at least <b>3 years</b> in prison within <b>7 years</b> of naturalisation.","Persons who acquired citizenship by naturalisation or registration may lose it if they are disloyal by act or speech, trade or do business with an enemy country at war with Nigeria, assist that enemy, or communicate unlawfully with it to harm Nigeria."]],
["Civic responsibilities",["Duties and obligations expected of citizens for the betterment of society and the functioning of the country: obey the law, protect public property, pay taxes, render national service, be loyal and respect others’ rights.","<b>Section 24 of the 1999 Constitution</b> makes it every citizen’s duty to: (A) abide by the Constitution and respect its ideals, institutions, the flag, anthem, pledge and legitimate authorities; (B) enhance the power, prestige and good name of Nigeria, defend it and render national service; (C) respect others’ dignity and rights and live in unity and harmony; (D) contribute positively to their community; (E) assist lawful agencies in maintaining law and order; (F) declare income honestly and pay tax promptly.","<b>Conclusion:</b> civic responsibility is both a legal obligation and a moral duty that promotes active citizenship and national development."]]]]];
