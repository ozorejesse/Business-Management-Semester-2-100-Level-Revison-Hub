const S=[
[5,"Pre-writing & Post-writing","Covers both ends of the writing process: the planning activities before drafting and the revising, editing and polishing activities after the first draft.",[
["Why plan and revise?",["Impactful writing needs a cohesive set of <b>pre-writing, during-writing and post-writing</b> activities with a seamless flow through the whole process.","Objectives: apply advanced pre-writing (mind mapping, free-writing, concept clustering); analyse and refine macro-structure (logical flow, coherence between paragraphs, a well-built argument); and write concisely and precisely by removing redundancies and refining terminology."]],
["What pre-writing is",["The phase that precedes the actual composition: strategic activities to <b>generate and organise ideas, establish a purpose and build a preliminary framework</b>.","Time invested here improves the clarity, coherence and overall quality of the final piece."]],
["Pre-writing techniques (with examples)",["<b>Brainstorming:</b> divergent thinking through mind mapping, free-writing or clustering; e.g. listing causes, effects and solutions before an essay on climate change.","<b>Freewriting:</b> unstructured writing that uncovers unexpected details, such as a novelist exploring a character’s backstory.","<b>Research:</b> gathering information first, e.g. types, benefits and challenges of renewable energy.","<b>Mind mapping:</b> branches for positive and negative aspects of social media to see connections.","<b>Outlining:</b> key points, evidence and logical flow before a speech.","<b>Identifying audience and purpose:</b> executives or stakeholders; inform or persuade; this shapes tone, style and content.","<b>Storyboarding:</b> a filmmaker plans the sequence of scenes visually.","<b>Drafting questions:</b> a journalist lists interview questions to cover relevant topics.","<b>Clustering:</b> a poet associates words and images around a central theme.","<b>Listing:</b> similarities and differences for a compare-and-contrast essay."]],
["What post-writing is",["Everything after the initial draft: a meticulous process of revising, editing and refining for clarity, coherence and adherence to academic conventions.","These activities are essential for a polished, final version."]],
["Post-writing activities (with examples)",["<b>Revision:</b> revisit the introduction so it captures attention and previews the content; reorganise paragraphs for flow.","<b>Editing for grammar and style:</b> a journalist removes errors and keeps sentence structure and style consistent.","<b>Peer review:</b> swap drafts for feedback on clarity, argument strength and weak areas.","<b>Proofreading:</b> catch typographical errors, misspellings and punctuation mistakes.","<b>Feedback from instructors or editors:</b> constructive criticism on plot, argument and structure.","<b>Checking citations and references:</b> accuracy and formatting, vital for academic integrity.","<b>Polishing transitions:</b> smooth, logical links between paragraphs and ideas.","<b>Formatting and presentation:</b> font size, margins and spacing for professionalism.","<b>Finalising conclusions:</b> make sure they summarise key points with a clear closing statement.","<b>Publishing or submitting:</b> the end of the process and the hand-over to the audience."]],
["Key takeaways",["Pre-writing = exploration, organisation and planning; post-writing = critical examination of the draft for content, style, grammar and presentation.","Further reading: Mogahed (2013) on planning pre-writing activities; Pahey, Matsumura and Valdés (2004) on the process approach to writing."]]]],

[6,"Summary, Letters & Reports","Shows the steps for three types of writing. The lesson compares summarising to drawing a concise map, letter writing to composing a message to a friend, and report writing to planning an expedition.",[
["The three types of writing",["<b>Summary:</b> a condensed version of a larger text that highlights the main ideas, key points and essential information.","<b>Letter:</b> a written message to a specific person or group, formal or informal, used to convey information, express feelings, make requests or maintain connections.","<b>Report:</b> a formal document presenting detailed information, analysis, findings and conclusions on a specific topic, with sections such as introduction, methodology, findings, conclusions and recommendations."]],
["Steps to writing a summary",["Read the text carefully.","Identify the thesis or main idea.","Highlight key points (supporting details and examples).","Condense the information in your own words, focusing on brevity and clarity.","Maintain the structure (logical order) of the original.","Eliminate unnecessary details unless crucial to the main idea.","Check for coherence.","Review and revise for conciseness, accuracy and clarity."]],
["Steps to writing a letter",["Identify purpose and audience.","Choose the right format (formal, informal, business).","Begin with a greeting (salutation).","Introduction: state the purpose for writing.","Body: organised paragraphs, one specific point each.","Keep a respectful, appropriate tone (politeness and tone).","Closing: summarise the main points and express gratitude or goodwill.","Closing salutation and signature.","Review and edit for grammar, clarity and coherence."]],
["Steps to writing a report",["Define the purpose.","Research and gather information.","Outline the structure (introduction, methodology, findings, conclusions, recommendations).","Write an introduction (topic, purpose, scope).","Present the methodology (how data was gathered, for transparency and reliability).","Analyse and present findings with evidence, using graphs, charts or tables.","Draw conclusions.","Make recommendations, if applicable.","Write a summary of the main points and outcomes.","Include references and appendices.","Review and revise for clarity, coherence and accuracy."]],
["Sample summary",["A long passage on politics (power, ideology, elections, legislatures, lobbying) is reduced to a short paragraph that keeps the main ideas: power dynamics, elections as pivotal moments, the ideological spectrum, legislatures shaping policy, and the influence of lobbying and vested interests."]],
["Sample letter (letter of appreciation)",["Parts: <b>greeting</b> (“Dear Mr Azeez,”), <b>opening sentence</b> (“I hope this letter finds you well.”), <b>purpose</b> (to express gratitude for support and collaboration on a recent project), <b>closing</b> (“Yours sincerely”) and <b>signature</b>.","It combines a warm greeting, a clearly stated purpose, appreciation and a polite close."]],
["Sample report (global poverty)",["<b>Introduction:</b> poverty as a persistent challenge; aims to analyse causes, consequences and solutions.","<b>Methodology:</b> systematic review of national and international statistical agencies, research institutions and NGOs.","<b>Findings:</b> rates declining but regional variation (Sub-Saharan Africa and parts of Asia higher); lack of education, healthcare and economic opportunity sustains poverty.","<b>Conclusions:</b> needs multifaceted interventions; <b>recommendations:</b> invest in education and healthcare, targeted development, social safety nets, and collaboration between governments, NGOs and the private sector."]],
["Key takeaways",["Summarising distils the main ideas with brevity, clarity and coherence.","Letters need purpose, audience, format, politeness and tone.","Reports need a structured approach with defined sections."]]]],

[7,"Comprehension: SQ3R","SQ3R is a systematic reading strategy that improves comprehension and retention of complex texts. It stands for Survey, Question, Read, Recite and Review.",[
["Reading strategies",["Techniques readers use to enhance comprehension, retention and effectiveness with written text; they help process information, extract meaning and understand material more deeply.","SQ3R is one of these strategies. Objectives: apply SQ3R to complex academic texts, form thought-provoking questions, seek answers and connections, and recognise its use across disciplines."]],
["Survey",["Quickly scan the whole text before detailed reading; look at <b>headings, subheadings, images</b> and other overview features.","Gives a sense of the text’s structure and main ideas.","Example: in a history textbook, look at chapter titles, subtitles and illustration captions to see the periods and key events covered."]],
["Question",["You ask questions (you do not answer the passage’s questions) based on what you found in the survey; they guide reading and focus attention on critical information.","Example: after surveying a scientific paper, ask “What is the primary hypothesis being tested?” or “What methods are used to collect data?”","Mid-lesson question: why focus on your own questions? Because they direct your reading and keep you actively engaged."]],
["Read",["Read the actual text with two goals: (1) read to answer the questions you generated; (2) read to engage with the material for a fuller understanding.","Highlighting key points while reading helps identify main ideas."]],
["Recite",["“Vocalise your thoughts”: verbally explain the key points, words and concepts from the text.","In the example, you restate the highlighted points and more, since they form the basis of the excerpt’s main idea."]],
["Review",["Create summaries, outlines or notes to reinforce understanding; organised notes make later review easier.","This step keeps a deep understanding over time so you can recall and apply it in exams or discussions."]],
["Worked example: The Renaissance",["Survey: the chapter title and opening paragraph show a 14th–17th century cultural and intellectual movement in Europe.","Question: What were its primary characteristics? How did it affect European society? Why does the shift from medieval traditions to humanism and individualism matter? What did da Vinci, Michelangelo and Shakespeare contribute?","Read and recite: revival of classical art, literature and learning; focus on humanism and individualism; notable figures."]],
["Key takeaways",["Survey (scan structure) → Question (your own questions) → Read (seek answers) → Recite (explain aloud) → Review (notes and revisit).","Further reading: Adler and Van Doren (1972), <i>How to Read a Book</i>; Armstrong (1982), <i>Study Is Hard Work</i>."]]]],

[8,"Vocabulary Expansion","Vocabulary expansion is the process of increasing the range of words and expressions you can use. This lesson covers its benefits, strategies and a list of academic terms.",[
["Why vocabulary matters",["<b>Communication skills:</b> precise, effective expression with fewer misunderstandings.","<b>Intellectual growth:</b> learning words means learning meanings, contexts and usage, which stimulates critical thinking.","<b>Academic achievement:</b> easier comprehension and analysis of complex texts; helps in language arts, literature and standardised tests.","<b>Professional success:</b> clearer, more persuasive communication and better writing.","<b>Cultural competence:</b> exposure to different cultures and ideas.","<b>Lifelong learning:</b> a continuous process beyond formal education.","<b>Reading and writing proficiency:</b> choosing the right words improves understanding and impact."]],
["Strategies for expansion",["Read widely and regularly to meet new words in different contexts.","Use dictionaries, thesauruses and language-learning apps.","Use new words in conversations, discussions and debates.","Play word games and join language activities (e.g. crosswords)."]],
["Teaching and learning terms",["<b>Pedagogy:</b> the method and practice of teaching.","<b>Curriculum:</b> the subjects in a course of study; the content and structure of a programme.","<b>Lecture:</b> an educational talk to an audience, typically in a university course.","<b>Seminar:</b> a small group in advanced study and research under a professor.","<b>Mentorship:</b> guidance from an experienced person to a less experienced one.","<b>Scholarship:</b> academic achievement, or a grant supporting a student’s education.","<b>Prerequisite:</b> a course or condition required before a more advanced course.","<b>Academician:</b> a person engaged in academic study or research.","<b>Tenure:</b> job security granted to a teacher after a probationary period.","<b>Rubric:</b> guidelines or criteria for evaluating and grading assignments."]],
["Thinking and knowledge terms",["<b>Epistemology:</b> the branch of philosophy on the nature, origin and scope of knowledge.","<b>Metacognition:</b> thinking about one’s own thinking processes.","<b>Syllogism:</b> reasoning that draws a conclusion from two premises (deductive).","<b>Synthesis:</b> combining different ideas or information into a new, integrated understanding.","<b>Exegesis:</b> critical explanation or interpretation, especially of a text.","<b>Semiotics:</b> the study of signs and symbols and their role in communication.","<b>Interdisciplinary:</b> involving multiple academic disciplines.","<b>Academic rigor:</b> the level of challenge, thoroughness and intellectual engagement expected.","<b>Quantitative analysis:</b> examining data through numerical and statistical methods."]],
["Writing and research terms",["<b>Research:</b> systematic investigation of materials and sources to establish facts and reach new conclusions.","<b>Thesis:</b> a statement put forward to be proved, or a long essay involving personal research for an advanced degree.","<b>Dissertation:</b> a long essay or thesis required for a higher degree.","<b>Citation:</b> a reference to a source, giving credit to the original author and avoiding plagiarism.","<b>Peer review:</b> evaluation of scholarly work by experts in the same field before publication.","<b>Lexicon:</b> the vocabulary of a person, language or branch of knowledge.","<b>Didactic:</b> intended to instruct, often in an overly moralistic way.","<b>Didacticism:</b> emphasising moral or educational messages in literature, art or teaching."]],
["Speech and sound terms",["<b>Elocution:</b> the skill of clear and expressive speech, especially public speaking.","<b>Cacophony:</b> a harsh, discordant mixture of sounds or voices."]],
["Key takeaways",["A rich, nuanced vocabulary is an investment in language proficiency and cognitive ability.","The lesson ends with a crossword practising these words (scholarship, peer, synthesis, rubric, interdisciplinary; lexicon, research, lecture, metacognition, didacticism)."]]]]];

["Freewriting","Unstructured writing to discover unexpected details","A novelist can explore a character’s backstory."],
["Storyboarding","Visual plan of the sequence of scenes","A filmmaker plans the narrative structure."],
["Clustering","Associating words around a central theme","A poet generates ideas for a poem."],
["Proofreading","Catching typos, misspellings and punctuation errors","A final check before submission."],
["Peer review (writing)","Feedback on a draft from a classmate","Shows clarity and the strength of arguments."],

let cur=[];
function gen(r){const t=$("ts").value,all=Q.map((_,i)=>i);
 if(r){cur=[...X];if(!cur.length){alert("No missed questions recorded yet!");return}}
 else cur=t=="all"?sh(all).slice(0,30):all.filter(i=>Q[i][0]==t);

 cur.forEach((qi,n)=>{const q=Q[qi],d=document.createElement("div");d.className="qd";
  d.innerHTML=`<span class="bd">Week ${q[0]} · ${T[q[0]]}</span><div class="qt">${n+1}. ${q[1]}</div><div class="op"></div><div class="ex"></div>`;

let L=null,R=null,mn=0,cp=[];
function resetM(){cp=sh(P).slice(0,8);mn=0;L=R=null;$("mf").style.display="none";$("ms").textContent="Matches Found: 0 / "+cp.length;
 [["lc",0],["rc",1]].forEach(([id,s])=>{const c=$(id);c.innerHTML="";sh(cp.map((_,i)=>i)).forEach(i=>{const d=document.createElement("div");d.className="mc";d.textContent=cp[i][s];d.onclick=()=>pick(d,i,s);c.appendChild(d)})})}
function pick(d,i,s){if(d.classList.contains("done"))return;
 document.querySelectorAll(s?"#rc .mc":"#lc .mc").forEach(x=>x.classList.remove("sel"));d.classList.add("sel");
 if(s)R={d,i};else L={d,i};
 if(!L||!R)return;const f=$("mf");f.style.display="block";
 if(L.i==R.i){L.d.className="mc done";R.d.className="mc done";f.className="mf ok";f.innerHTML="<b>Correct Match!</b><br>"+cp[L.i][0]+" ⟺ "+cp[L.i][1]+"<br>"+cp[L.i][2];mn++;$("ms").textContent="Matches Found: "+mn+" / "+cp.length}
 else{const a=L.d,b=R.d;a.classList.add("bad");b.classList.add("bad");f.className="mf no";f.innerHTML="<b>Incorrect pair.</b> Try again!";setTimeout(()=>{a.classList.remove("bad","sel");b.classList.remove("bad","sel")},800)}
 L=R=null}
